<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wholesale Homeware Products | Summer's Secret</title>
  <meta name="description" content="Browse wholesale ceramic vases, candles, candle holders, mugs and decorative homeware. Custom colors, packaging and OEM/ODM available.">
  <link rel="canonical" href="https://summersecret.cn/products.html">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section><div class="container"><div class="filters" id="filters"><button class="filter active" data-cat="all">All Products</button><button class="filter" data-cat="vases">Vases</button><button class="filter" data-cat="candles">Candles</button><button class="filter" data-cat="holders">Candle Holders</button><button class="filter" data-cat="tableware">Mugs</button></div><div class="product-grid" id="productGrid"></div></div></section>
    <section class="cta"><div class="container section-head"><div><p class="eyebrow" style="color:#dfe8e0">Custom development</p><h2>Need a shape, finish or pack that's uniquely yours?</h2><p>Send us a mood board or technical drawing. We support custom molds, glaze matching, decals, gift boxes and barcode labeling.</p></div><a class="btn" href="contact.html#inquiry">Discuss OEM / ODM &rarr;</a></div></section>
  </main>
  <div id="site-footer"></div>
  <script src="app.js"></script>
  <script>
    init('products');
    renderProducts('#productGrid');
    const wanted = new URLSearchParams(location.search).get('cat') || 'all';
    function filterProducts(category) {
      document.querySelectorAll('.filter').forEach(button => button.classList.toggle('active', button.dataset.cat === category));
      document.querySelectorAll('.product').forEach(product => product.style.display = category === 'all' || product.dataset.cat === category ? 'block' : 'none');
    }
    document.querySelectorAll('.filter').forEach(button => button.onclick = () => filterProducts(button.dataset.cat));
    filterProducts(wanted);
  </script>
</body>
</html>
